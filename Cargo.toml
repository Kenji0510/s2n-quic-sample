[package]
name = "s2n-quic-sample"
version = "0.1.0"
edition = "2024"

[dependencies]
log = "0.4.28"
env_logger = "0.11.8"
anyhow = "1"

s2n-quic = "1.68.0"
tokio = { version = "1.48.0", features = ["full"] }

pcd-rs = { version = "0.12.0", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
bytes = "1.10.1"
bincode = "1.3"